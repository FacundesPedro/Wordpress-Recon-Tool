services:
  recon:
    build: .
    image: wp-recon-tool:latest
    container_name: wp-recon
    volumes:
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - WP_TARGET=${WP_TARGET:-https://example.com}
      - WP_OUTPUT_FORMAT=${WP_OUTPUT_FORMAT:-markdown}
      - WP_THREADS=${WP_THREADS:-2}
      - WP_TIMEOUT=${WP_TIMEOUT:-10}
      - WP_LOG_LEVEL=${WP_LOG_LEVEL:-INFO}
      - WP_PROFILE=${WP_PROFILE:-light}
    command: ["main"]
